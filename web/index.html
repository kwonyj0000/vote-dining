<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 메뉴 투표</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; margin-bottom: 24px; }
    .add-form { display: flex; gap: 8px; margin-bottom: 32px; }
    .add-form input { flex: 1; padding: 8px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    .add-form button { padding: 8px 16px; font-size: 1rem; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .add-form button:hover { background: #2563eb; }
    #menu-list { list-style: none; padding: 0; margin: 0; }
    #menu-list li { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .menu-info { display: flex; align-items: center; gap: 12px; }
    .rank { font-size: 0.85rem; color: #6b7280; width: 20px; text-align: right; }
    .menu-name { font-size: 1rem; }
    .vote-count { font-size: 0.9rem; color: #6b7280; }
    .action-btns { display: flex; gap: 6px; }
    .vote-btn { padding: 6px 14px; font-size: 0.9rem; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; }
    .vote-btn:hover { background: #e5e7eb; }
    .del-btn { padding: 6px 14px; font-size: 0.9rem; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 6px; cursor: pointer; color: #dc2626; }
    .del-btn:hover { background: #fecaca; }
    .empty { color: #9ca3af; font-size: 0.95rem; padding: 16px 0; }
    .search-section { margin-top: 32px; padding-top: 24px; border-top: 2px solid #e5e7eb; }
    .search-section h2 { font-size: 1rem; margin: 0 0 12px; color: #374151; }
    .search-form { display: flex; gap: 8px; }
    .search-form input { flex: 1; padding: 8px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    .search-btn { padding: 8px 16px; font-size: 1rem; background: #16a34a; color: #fff; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .search-btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <h1>🍽 팀 메뉴 투표</h1>

  <div class="add-form">
    <input id="menu-input" type="text" placeholder="메뉴 이름 입력" />
    <button onclick="addMenu()">등록</button>
  </div>

  <ul id="menu-list"></ul>

  <div class="search-section">
    <h2>투표 완료 후 맛집 검색</h2>
    <div class="search-form">
      <input id="location-input" type="text" placeholder="검색할 지역 입력 (예: 강남구)" />
      <button class="search-btn" onclick="openNaverMap()">🗺 맛집 검색</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
